name: Release · Publicar versão
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag / Tag da versão (ex.: v0.1.1)'
        required: true
        default: v0.1.1
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version · Validar versão
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$TAG" = "v$version" || { echo "Tag must match versionName / A tag deve corresponder a versionName"; exit 1; }
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Install Android SDK · Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure optional release signing · Configurar assinatura opcional
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Verify and build · Verificar e compilar
        run: |
          python3 tools/check_resources.py
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Prepare APK and checksums · Preparar APK e verificações
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${RELEASE_KEYSTORE_PATH:-}" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/hent-ir-remote-${RELEASE_TAG}.apk"
            printf '\n\nSigned with the maintainer key. / Assinado com a chave do mantenedor.\n' >> docs/RELEASE_NOTES.md
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/hent-ir-remote-${RELEASE_TAG}-debug-signed.apk"
            printf '\n\n**Debug-signed experimental APK:** future builds may require uninstalling the previous APK.\n**APK experimental assinado para depuração:** versões futuras podem exigir desinstalar o APK anterior.\n' >> docs/RELEASE_NOTES.md
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish prerelease · Publicar pré-lançamento
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists / A versão já existe'; exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Hent IR Remote $RELEASE_TAG · Experimental" --notes-file docs/RELEASE_NOTES.md
      - name: Remove signing material · Remover chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
